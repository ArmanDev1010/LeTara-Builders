name: Yuri Adamyan
headline: Couldn’t be happier with them
review: >-
  Got in contact with Andranik aka Andy for a pergola for my back yard and a bbq
  area. He showed up on time with lots of ideas and helped me from start to
  finish. The pergolas are very good quality and come with lights fans and much
  more. Couldn’t be happier with them and I recommend them to anyone that is in
  need of a Patio.
stars: '5'
